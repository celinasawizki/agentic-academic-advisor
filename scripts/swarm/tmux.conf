# Project-scoped tmux config for tap-agents.
# Loaded explicitly via `tmux -f .tmux.conf` by scripts/start-swarm.sh —
# does NOT touch the user's global ~/.tmux.conf.

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 20000

# Pane titles (set per-pane by start-swarm.sh): a colored "@role" badge on
# teammate panes, plain text on the lead (orchestrator) pane and the small
# status-card panes — mirrors a lead/teammate swarm dashboard look.
set -g pane-border-status top
# Match on substring (not exact equality): Claude Code's own TUI overwrites
# a pane's title with its own busy/idle indicator (e.g. "✳ researcher"), so
# the role name we set via select-pane -T only ever survives as a substring.
set -g pane-border-format "#{?#{m/r:researcher,#{pane_title}},#[fg=black#,bold]#[bg=colour220] @researcher #[default],#{?#{m/r:builder,#{pane_title}},#[fg=black#,bold]#[bg=colour39] @builder #[default],#{?#{m/r:reviewer,#{pane_title}},#[fg=black#,bold]#[bg=colour213] @reviewer #[default],#{?#{m/r:orchestrator,#{pane_title}}, orchestrator ,#{pane_title}}}}}"
set -g pane-active-border-style "fg=colour39"
set -g pane-border-style "fg=colour238"

# Window/tab title, styled like a swarm "mission control" terminal header
set -g set-titles on
set -g set-titles-string "#{session_name} — tmux attach -t #{session_name} — #{client_width}x#{client_height}"

# Modern, clean status bar
set -g status-style "bg=colour234,fg=colour250"
set -g status-left-length 40
set -g status-left " #[fg=colour39,bold]tap-agents #[fg=colour244]| "
set -g status-right "#[fg=colour244]%H:%M "
set -g window-status-current-style "fg=colour39,bold"
set -g status-interval 5

# Easy keyboard navigation: prefix + hjkl to move between panes,
# prefix + H/J/K/L to resize, arrow keys also work by default.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+arrow to switch panes without the prefix key
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Quick window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2

set -g mode-keys vi
